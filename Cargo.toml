[package]
name = "ws-broadcast-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

jsonwebtoken = "9"
futures-util = "0.3"

argon2 = "0.5"
password-hash = "0.5"
rand_core = "0.6"

sqlx = { version = "0.7", features = ["runtime-tokio", "postgres"] }

dotenvy = "0.15"